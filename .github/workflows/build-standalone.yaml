---
name: Build Standalone
run-name: "Build Standalone ${{ github.ref_name }}"

# Publishes the standalone image, unlike standalone-image-checks.yaml (PR
# validation only, push: false). Mirrors build.yaml/build-beta.yaml's native
# multi-arch matrix + manifest-merge shape, simplified: standalone has no
# version scheme of its own yet, so this tags :latest and the short commit
# SHA on every push to main that touches standalone/, plus manual dispatch
# for an on-demand rebuild. A real vN.N.N tag scheme (like build.yaml's v*)
# can be layered on later once this settles.

on:
  push:
    branches:
      - main
    paths:
      - "standalone/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ha_opencode_standalone

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get short SHA
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: standalone
          file: standalone/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ matrix.arch }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ matrix.arch }}:${{ steps.sha.outputs.short }}
          build-args: |
            BUILD_VERSION=${{ steps.sha.outputs.short }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=standalone-build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=standalone-build-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=OpenCode Standalone
            org.opencontainers.image.description=AI coding agent for Home Assistant - standalone Docker build, no Supervisor/HAOS required
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Unlicense AND MIT

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get short SHA
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${SHORT_SHA}" \
            "${IMAGE}/amd64:latest" \
            "${IMAGE}/aarch64:latest"

      - name: Inspect multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        run: docker buildx imagetools inspect "${IMAGE}:latest"
