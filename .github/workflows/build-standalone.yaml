---
name: Build Standalone
run-name: "Build Standalone ${{ github.ref_name }}"

# Publishes the standalone image, unlike standalone-image-checks.yaml (PR
# validation only, push: false). Mirrors build.yaml/build-beta.yaml's native
# multi-arch matrix + manifest-merge shape, simplified: standalone has no
# version scheme of its own yet, so this tags :latest and the short commit
# SHA on every push to main that touches standalone/, plus manual dispatch
# for an on-demand rebuild. A real vN.N.N tag scheme (like build.yaml's v*)
# can be layered on later once this settles.

on:
  push:
    branches:
      - main
    paths:
      - "standalone/**"
  # TEMPORARY: lets PR #1 publish a real image for local testing before merge
  # (workflow_dispatch can't be used for this - GitHub only recognizes a
  # dispatchable workflow once it exists on the default branch). Tags land on
  # :pr-<number>, never :latest, so this can't be confused with a main build.
  # Remove this trigger once PR #1 no longer needs it; see the "channel" step
  # below, which also becomes dead weight (always "latest") once it's gone.
  pull_request:
    paths:
      - "standalone/**"
      - ".github/workflows/build-standalone.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ha_opencode_standalone

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get short SHA
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # TEMPORARY (see the pull_request trigger comment above): "latest" for
      # a real push to main, "pr-<number>" for the PR-triggered test publish.
      - name: Compute image channel tag
        id: channel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: standalone
          file: standalone/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ matrix.arch }}:${{ steps.channel.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ matrix.arch }}:${{ steps.sha.outputs.short }}
          build-args: |
            BUILD_VERSION=${{ steps.sha.outputs.short }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=standalone-build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=standalone-build-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=OpenCode Standalone
            org.opencontainers.image.description=AI coding agent for Home Assistant - standalone Docker build, no Supervisor/HAOS required
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Unlicense AND MIT

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get short SHA
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # TEMPORARY: matches the "channel" step in the build job above.
      - name: Compute image channel tag
        id: channel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          CHANNEL: ${{ steps.channel.outputs.tag }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${CHANNEL}" \
            --tag "${IMAGE}:${SHORT_SHA}" \
            "${IMAGE}/amd64:${CHANNEL}" \
            "${IMAGE}/aarch64:${CHANNEL}"

      - name: Inspect multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          CHANNEL: ${{ steps.channel.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${CHANNEL}"
